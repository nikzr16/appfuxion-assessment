# Alembic configuration. The database URL is NOT set here: migrations/env.py reads it
# from the application settings (root .env / environment variables).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 0001_enable_pgvector.py style names for readable ordering.
file_template = %%(rev)s_%%(slug)s
