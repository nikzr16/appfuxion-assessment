name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: appfuxion
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: appfuxion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appfuxion -d appfuxion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same variables the app reads from .env locally. No OPENAI_API_KEY on purpose:
      # tests use FakeLLM and must never reach the real API.
      POSTGRES_USER: appfuxion
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: appfuxion
      POSTGRES_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
