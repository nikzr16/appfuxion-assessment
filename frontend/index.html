<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload invoices and receipts and get validated, structured data with an AI summary." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Document Intelligence</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      // Mirrors applyTheme() in src/lib/theme.ts.
      (function () {
        var preference = "system";
        try {
          preference = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
