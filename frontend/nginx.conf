server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: same origin as the UI, so the browser needs no CORS. The URI is passed
    # through unchanged (the backend serves everything under /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads (feature 0001) go through here; keep above MAX_UPLOAD_MB.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
